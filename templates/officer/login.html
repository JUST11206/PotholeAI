
{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>🛡️ Pothole AI</h1>

        <h2>Officer Login</h2>

        <p>
            Authority Monitoring Portal
        </p>

        <form>

            <input
                type="email"
                id="officer-email"
                placeholder="Officer Email"
                required
            >

            <input
                type="password"
                id="officer-password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                onclick="officerLogin()"
            >
                Officer Login
            </button>

        </form>

        <p>
            New officer?
            <a href="/auth/officer/signup">
                Create Officer Account
            </a>
        </p>

        <p>
            <a href="/auth/login">
                ← Citizen Login
            </a>
        </p>

    </div>

</div>

<script type="module" src="/static/js/officer-auth.js"></script>

{% endblock %}
