{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Verify Email</h1>

        <p>
            Enter the 6-digit OTP sent to your email.
        </p>

        <form
            action="/auth/verify-otp"
            method="POST"
        >

            <input
                type="text"
                name="otp"
                maxlength="6"
                placeholder="Enter OTP"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>

</div>

{% endblock %}
