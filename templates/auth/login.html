{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>🚧 Pothole AI</h1>

        <h2>Login</h2>

        <form>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="button" onclick="loginUser()">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/auth/signup">
                Create Account
            </a>
        </p>

    </div>

</div>

<script type="module" src="/static/js/auth.js"></script>
<script src="/static/js/app.js"></script>
{% endblock %}
